name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validar aplicação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install fastapi pydantic
          fi

      - name: Verificar sintaxe
        run: |
          TARGETS=""
          for dir in api scanner; do
            if [ -d "$dir" ]; then TARGETS="$TARGETS $dir"; fi
          done
          if [ -z "$TARGETS" ]; then
            echo "Nenhum diretório de código encontrado."
            exit 0
          fi
          echo "Verificando:$TARGETS"
          python -m compileall -q $TARGETS
          echo "Sintaxe OK."

      - name: Subir a API e validar o health check
        run: |
          if [ ! -f api/main.py ]; then
            echo "api/main.py ainda não existe — etapa ignorada."
            exit 0
          fi

          pip install "uvicorn[standard]"
          uvicorn api.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          SERVER_PID=$!

          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              echo "API respondeu em http://127.0.0.1:8000/"
              curl -s http://127.0.0.1:8000/ | head -c 600
              echo
              echo "--- Endpoints documentados ---"
              python -c "
import json, urllib.request
with urllib.request.urlopen('http://127.0.0.1:8000/openapi.json') as r:
    spec = json.load(r)
paths = spec.get('paths', {})
print(f'Total: {len(paths)}')
for route, methods in sorted(paths.items()):
    for m in methods:
        print(f'  {m.upper()} {route}')
"
              kill $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done

          echo "A API não respondeu. Log do servidor:"
          cat /tmp/uvicorn.log
          exit 1
          
