name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & import check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install fastapi uvicorn pydantic
          fi
          pip install ruff

      - name: Verificar sintaxe e imports
        run: |
          TARGETS=""
          for dir in api scanner; do
            if [ -d "$dir" ]; then TARGETS="$TARGETS $dir"; fi
          done
          if [ -z "$TARGETS" ]; then
            echo "Nenhum diretório de código encontrado — nada a verificar."
            exit 0
          fi
          echo "Verificando:$TARGETS"
          python -m compileall -q $TARGETS

      - name: Lint com Ruff
        run: |
          TARGETS=""
          for dir in api scanner; do
            if [ -d "$dir" ]; then TARGETS="$TARGETS $dir"; fi
          done
          if [ -z "$TARGETS" ]; then
            echo "Nenhum diretório de código encontrado — nada a lintar."
            exit 0
          fi
          # E9 = erro de sintaxe, F = nomes indefinidos e imports não usados.
          # Estilo fica fora para não travar o CI em código legado.
          ruff check --select E9,F $TARGETS

      - name: Subir a API e validar o health check
        run: |
          if [ ! -f api/main.py ]; then
            echo "api/main.py ainda não existe — etapa ignorada."
            exit 0
          fi
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              echo "API respondeu:"
              curl -s http://127.0.0.1:8000/ | head -c 500
              echo
              exit 0
            fi
            sleep 2
          done
          echo "A API não respondeu no tempo esperado."
          exit 1

      - name: Validar o schema OpenAPI
        run: |
          if [ ! -f api/main.py ]; then
            echo "api/main.py ainda não existe — etapa ignorada."
            exit 0
          fi
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/openapi.json") as r:
              spec = json.load(r)
          paths = spec.get("paths", {})
          print(f"Endpoints documentados: {len(paths)}")
          for route, methods in sorted(paths.items()):
              for method in methods:
                  print(f"  {method.upper()} {route}")
          assert paths, "O schema OpenAPI veio vazio"
          PY
          
