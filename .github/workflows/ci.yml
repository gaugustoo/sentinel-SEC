name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & import check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Verificar sintaxe e imports
        run: |
          python -m compileall -q api scanner

      - name: Lint com Ruff
        run: ruff check api scanner

      - name: Subir a API e validar o health check
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              echo "API respondeu em http://127.0.0.1:8000/"
              curl -s http://127.0.0.1:8000/
              exit 0
            fi
            sleep 2
          done
          echo "A API não respondeu no tempo esperado"
          exit 1

      - name: Validar o schema OpenAPI
        run: |
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/openapi.json") as r:
              spec = json.load(r)
          paths = spec.get("paths", {})
          print(f"Endpoints documentados: {len(paths)}")
          for route, methods in sorted(paths.items()):
              for method in methods:
                  print(f"  {method.upper()} {route}")
          assert paths, "O schema OpenAPI veio vazio"
          PY
          
